[package]
name = "slate-app"
version = "0.0.1"
edition = "2021"
description = "Native Rust Slate desktop application"

[lib]
name = "slate_app"
path = "src/lib.rs"

[[bin]]
name = "slate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
portable-pty = "0.9"
vt100 = "0.16.2"
vte = "0.15"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.22.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.22.0", features = ["x11"] }
raw-window-handle = { version = "0.6", features = ["std"] }
serde = { version = "1", features = ["derive"] }
# preserve_order is load-bearing, not a preference: the command journal hashes
# JSON.stringify's output, and JavaScript writes object keys in insertion order.
# With serde_json's default BTreeMap every multi-key payload would serialize in
# sorted order and every hash in the chain would differ from the one TypeScript
# wrote. See src/journal.rs.
# float_roundtrip is equally load-bearing. serde_json's default float parser is
# fast but not always correctly rounded: it read a real canvas coordinate,
# 3844.7897983016796, as the double one ULP above it, which then printed back as
# 3844.78979830168 and broke the hash. Reading state the app already wrote has
# to be exact, so the slower correctly-rounded parser is the right trade.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
# Widget insertion order is part of the snapshot: listWidgets() returns the
# JavaScript Map in insertion order, so a sorted map would produce a different
# snapshot that no longer matches what Electron wrote.
indexmap = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
# OSC 52 clipboard payloads arrive base64-encoded; the GUI decodes them into
# the gpui clipboard.
base64 = "0.22"
log = "0.4"
env_logger = "0.11"

[features]
default = []

# Unix only: kill(2) on a negative pid is what reaps a terminal's whole
# process group. Already in the dependency graph via portable-pty, so this
# adds no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux only: the browser widget's embedded webview. `wry` builds the
# WebKitGTK child view (`build_as_child` on X11) and `gtk` owns the event
# loop it needs on a dedicated thread — the same pairing the vendored
# element used at 2cf4566. Kept target-gated so other platforms neither
# build it nor see it; the element falls back to empty bounds there.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wry = "0.57"
gtk = "0.18"

# Windows only: listing a shell's children is what lets a terminal that has
# stopped reading its input be interrupted without killing the shell along
# with it. Already in the dependency graph via portable-pty; only the
# tlhelp32 module is new.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["handleapi", "tlhelp32", "jobapi2", "processthreadsapi", "minwinbase", "sysinfoapi"] }
